services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: market-scope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ms}
      POSTGRES_DB: ${POSTGRES_DB:-ms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ms} -d ${POSTGRES_DB:-ms}"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 30s

volumes:
  db_data:
