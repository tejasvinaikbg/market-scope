services:
  db:
    image: postgis/postgis:16-3.4 # the Debian build has an arm64 image; alpine is amd64-only
    container_name: market-scope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - '${POSTGRES_PORT:?set in .env}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 30s

  # The route tests' own server: the same image, no volume (its data lives and dies with the container), started on demand
  # by `npm run db:test:up`, never pointed at by a server. The dev database above cannot see it, and vice versa.
  db-test:
    image: postgis/postgis:16-3.4
    profiles: ['test']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?set in .env}
    ports:
      - '${POSTGRES_TEST_PORT:?set in .env}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}']
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 10s

  # The whole stack from the images (`docker compose --profile app up -d --build`): the deployed shape on one machine.
  # Migrations first: `docker compose --profile app run --rm api node src/db/migrate.ts`.
  api:
    image: market-scope-api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ['app']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JOBS: 'off' # the worker below runs the queue
      PORT: '4200'
    ports:
      - '${API_PORT:-4200}:4200'
    depends_on:
      db: { condition: service_healthy }
  worker:
    image: market-scope-api # the same image as the api; only the command differs
    profiles: ['app']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ['node', 'src/worker.ts']
    depends_on:
      db: { condition: service_healthy }
  web:
    image: market-scope-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-} # blank: the browser calls /api on this server, which forwards to the api service
        API_URL: http://api:4200 # the forward's target, compiled in at build time
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-} # blank: the OpenStreetMap ground
    profiles: ['app']
    ports:
      - '${WEB_PORT:-3200}:3200'
    depends_on:
      - api

volumes:
  db_data:
