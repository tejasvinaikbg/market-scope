# Every push and pull request: typecheck, the unit and component suites, the route suites against a real PostGIS, the
# end-to-end run, and both container images built (not pushed). Nothing here is specific to a machine or a person:
# the throwaway database's name and user come from repository variables, its password from a repository secret, and
# each has a fallback so a fresh fork runs as is. Set them under Settings → Secrets and variables → Actions.
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_DB_USER: ${{ vars.CI_DB_USER || 'ci' }}
  CI_DB_NAME: ${{ vars.CI_DB_NAME || 'market_scope_ci' }}
  CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
  CI_NOMINATIM_USER_AGENT: ${{ vars.CI_NOMINATIM_USER_AGENT || format('market-scope-ci/0.1 (+https://github.com/{0})', github.repository) }}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ${{ vars.CI_DB_USER || 'ci' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-only-password' }}
          POSTGRES_DB: ${{ vars.CI_DB_NAME || 'market_scope_ci' }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_DB_USER || 'ci' }}"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The API reads its settings from the environment; these are the throwaway values for this job only.
      - name: Point the tests at the service container
        run: |
          {
            echo "DATABASE_URL=postgres://${CI_DB_USER}:${CI_DB_PASSWORD}@localhost:5432/${CI_DB_NAME}"
            echo "TEST_DATABASE_URL=postgres://${CI_DB_USER}:${CI_DB_PASSWORD}@localhost:5432/${CI_DB_NAME}_test"
            echo "NOMINATIM_USER_AGENT=${CI_NOMINATIM_USER_AGENT}"
            echo "GEOCODER=fixture"
            echo "PLACES=fixture"
            echo "JOBS=off"
          } >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - name: Route tests against their own database
        run: npm run test:integration --workspace apps/api
      - name: Browsers for the end-to-end run
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
