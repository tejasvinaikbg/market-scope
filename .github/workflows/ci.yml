# Every push and pull request: typecheck, the unit and component suites, the route suites against a real PostGIS, and
# both container images built (not pushed). The route tests own their database here as they do locally.
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ms
          POSTGRES_PASSWORD: ms
          POSTGRES_DB: market_scope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ms -d market_scope"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ms:ms@localhost:5432/market_scope
      TEST_DATABASE_URL: postgres://ms:ms@localhost:5432/market_scope_test
      NOMINATIM_USER_AGENT: market-scope-ci/0.1 (ci@example.invalid)
      GEOCODER: fixture
      PLACES: fixture
      JOBS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Route tests against their own database
        run: npm run test:integration --workspace apps/api
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
