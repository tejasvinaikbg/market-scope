<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="30" y="40" width="280" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="170.0" y="64.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">POST /api/markets</text>
<text x="170.0" y="79.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">validate · measure with PostGIS</text>
<text x="170.0" y="94.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">insert market + queue job (one transaction)</text>
<rect x="30" y="160" width="280" height="56" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="170.0" y="184.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Worker claims the job</text>
<text x="170.0" y="199.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">FOR UPDATE SKIP LOCKED</text>
<rect x="30" y="260" width="280" height="66" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="170.0" y="282.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 · Locate</text>
<text x="170.0" y="297.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">portfolio rows without coordinates,</text>
<text x="170.0" y="312.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">inside the city box (Nominatim)</text>
<rect x="30" y="370" width="280" height="66" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="170.0" y="392.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">2 · Place</text>
<text x="170.0" y="407.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">every portfolio store: inside · outside · unlocated</text>
<text x="170.0" y="422.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">(ST_Covers, one statement)</text>
<rect x="360" y="260" width="300" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="510.0" y="284.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">3 · Discover</text>
<text x="510.0" y="299.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">grid cells over the boundary → tile cache or Overpass</text>
<text x="510.0" y="314.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">keep what lies inside · upsert · progress per cell</text>
<rect x="360" y="370" width="300" height="66" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="510.0" y="392.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">4 · Match</text>
<text x="510.0" y="407.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">nearest discovered store, same category,</text>
<text x="510.0" y="422.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">within 150 m (ST_DWithin)</text>
<rect x="360" y="480" width="300" height="56" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="510.0" y="504.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Status</text>
<text x="510.0" y="519.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">ready · partial (some cells failed) · failed</text>
<rect x="720" y="260" width="250" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="845.0" y="284.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Dashboard</text>
<text x="845.0" y="299.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">polls the market every 2 s while it runs;</text>
<text x="845.0" y="314.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">reads the stores list when it ends</text>
<rect x="720" y="40" width="250" height="62" rx="0" fill="#f5f5f5" stroke="#999999"/>
<text x="728" y="56" font-size="11" fill="#333">Every step rewrites its own rows, so a run</text>
<text x="728" y="71" font-size="11" fill="#333">can be repeated safely: &quot;run again&quot;, an</text>
<text x="728" y="86" font-size="11" fill="#333">edit, or a job taken over after a worker died.</text>
<path d="M170.0,110 V135.0 H170.0 V160" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M170.0,216 V238.0 H170.0 V260" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M170.0,326 V348.0 H170.0 V370" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M310,403.0 H335.0 V295.0 H360" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M510.0,330 V350.0 H510.0 V370" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M510.0,436 V458.0 H510.0 V480" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M660,508 L690,508 L690,295 L720,295" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="690" y="395" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">status, counts</text>
</svg>