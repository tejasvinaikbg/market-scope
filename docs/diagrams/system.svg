<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="900" height="510" fill="#ffffff"/>
<rect x="40" y="30" width="530" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="305.0" y="48.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">packages/shared</text>
<text x="305.0" y="63.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">boundary maths, file contract, constants — imported by API and web alike</text>
<rect x="600" y="20" width="280" height="76" rx="0" fill="#f5f5f5" stroke="#999999"/>
<text x="608" y="36" font-size="11" fill="#333">Deployed: the browser calls the API directly</text>
<text x="608" y="51" font-size="11" fill="#333">(NEXT_PUBLIC_API_URL); the worker is its own</text>
<text x="608" y="66" font-size="11" fill="#333">process (JOBS=off on the API). Locally one</text>
<text x="608" y="81" font-size="11" fill="#333">process does both; the web server proxies /api.</text>
<rect x="40" y="120" width="200" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Web server</text>
<text x="140.0" y="159.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">next (3200)</text>
<text x="140.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">serves pages; proxies /api locally</text>
<rect x="40" y="260" width="200" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140.0" y="284.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Browser</text>
<text x="140.0" y="299.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Next.js app (React, Leaflet)</text>
<text x="140.0" y="314.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">upload · setup · dashboard</text>
<rect x="40" y="420" width="200" height="60" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="140.0" y="446.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">OpenStreetMap tiles</text>
<text x="140.0" y="461.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">map images, straight to the browser</text>
<rect x="360" y="120" width="210" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="465.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">API</text>
<text x="465.0" y="159.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Express 5 (4200)</text>
<text x="465.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">routes → services → queries</text>
<rect x="360" y="260" width="210" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="465.0" y="284.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Worker</text>
<text x="465.0" y="299.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">the same code, JOBS=on</text>
<text x="465.0" y="314.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">claims jobs, runs the pipeline</text>
<rect x="360" y="420" width="210" height="60" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="465.0" y="439.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Nominatim</text>
<text x="465.0" y="454.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">address → point; a city&#x27;s box</text>
<text x="465.0" y="469.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">(the API asks that once per city)</text>
<path d="M690,150 a85.0,10 0 1,1 170,0 v110 a85.0,10 0 1,1 -170,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="775.0" cy="150" rx="85.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
