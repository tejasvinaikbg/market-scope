<text x="775.0" y="207.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">+ PostGIS</text>
<text x="775.0" y="222.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">markets, stores,</text>
<text x="775.0" y="237.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">jobs, tile cache</text>
<rect x="690" y="420" width="170" height="60" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="775.0" y="446.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Overpass</text>
<text x="775.0" y="461.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">stores inside a grid cell</text>
