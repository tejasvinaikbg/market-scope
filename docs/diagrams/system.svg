<path d="M570,295 L630,295 L630,240 L690,240" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="630" y="290" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">claim · write</text>
<path d="M465.0,330 V375.0 H465.0 V420" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="471.0" y="371.0" text-anchor="start" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">1 req/s</text>
<path d="M570,322 L630,330 L630,450 L690,450" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
