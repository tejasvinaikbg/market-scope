<path d="M240,295 L300,295 L300,175 L360,175" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="300" y="290" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">deployed: direct</text>
