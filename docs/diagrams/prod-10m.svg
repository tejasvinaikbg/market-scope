<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="500" viewBox="0 0 1090 500" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1090" height="500" fill="#ffffff"/>
<rect x="30" y="30" width="1030" height="44" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="545.0" y="48.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Global edge</text>
<text x="545.0" y="63.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">CDN · WAF · per-tenant rate rules · static web · map tiles proxied and cached · SSE routed to the push tier</text>
<rect x="30" y="120" width="220" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="140.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Identity</text>
<text x="140.0" y="159.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">authentication, tenants,</text>
<text x="140.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">per-tenant quotas</text>
<rect x="290" y="120" width="240" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="410.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">API tier, per region</text>
<text x="410.0" y="159.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">autoscaled, stateless</text>
<text x="410.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">reads go to the region&#x27;s replica</text>
<rect x="570" y="120" width="260" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="700.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Status push</text>
<text x="700.0" y="159.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">SSE gateway tier or a push service</text>
<text x="700.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">(Ably, AppSync); notify when the queue is deep</text>
<path d="M870,130 a95.0,10 0 1,1 190,0 v70 a95.0,10 0 1,1 -190,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="965.0" cy="130" rx="95.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="965.0" y="160.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Broker</text>
<text x="965.0" y="175.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">SQS or BullMQ on Redis</text>
<text x="965.0" y="190.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">jobs table as the outbox</text>
<path d="M30,260 a110.0,10 0 1,1 220,0 v70 a110.0,10 0 1,1 -220,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="140.0" cy="260" rx="110.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="140.0" y="297.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Read replicas</text>
<text x="140.0" y="312.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">per region</text>
<path d="M290,260 a120.0,10 0 1,1 240,0 v80 a120.0,10 0 1,1 -240,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="410.0" cy="260" rx="120.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="410.0" y="295.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Postgres, partitioned</text>
<text x="410.0" y="310.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">by tenant / market id</text>
<text x="410.0" y="325.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">primary per region</text>
<rect x="570" y="250" width="260" height="70" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="700.0" y="274.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Worker pools by job type</text>
<text x="700.0" y="289.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">geocode · discover · match</text>
<text x="700.0" y="304.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">scaled on queue depth</text>
<path d="M870,260 a95.0,10 0 1,1 190,0 v70 a95.0,10 0 1,1 -190,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="965.0" cy="260" rx="95.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="965.0" y="290.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Tile cache in Redis</text>
<text x="965.0" y="305.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">cell answers served hot;</text>
<text x="965.0" y="320.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Postgres keeps the durable copy</text>
<path d="M30,390 a110.0,10 0 1,1 220,0 v70 a110.0,10 0 1,1 -220,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="140.0" cy="390" rx="110.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="140.0" y="420.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Object storage</text>
<text x="140.0" y="435.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">uploads straight from the</text>
<text x="140.0" y="450.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">browser (presigned) · exports</text>
<path d="M290,390 a120.0,10 0 1,1 240,0 v70 a120.0,10 0 1,1 -240,0 z" fill="#fff2cc" stroke="#d6b656"/><ellipse cx="410.0" cy="390" rx="120.0" ry="10" fill="#fff2cc" stroke="#d6b656"/>
<text x="410.0" y="420.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Event stream (Kafka / SNS)</text>
<text x="410.0" y="435.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">&quot;market discovered&quot; and the like</text>
<text x="410.0" y="450.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">for other systems and analytics</text>
<rect x="570" y="380" width="260" height="70" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="700.0" y="404.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Geo service</text>
<text x="700.0" y="419.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">self-hosted Overpass + Nominatim per region,</text>
<text x="700.0" y="434.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">nightly extracts; Google as a paid fallback</text>
<rect x="870" y="380" width="190" height="90" rx="0" fill="#f5f5f5" stroke="#999999"/>
<text x="878" y="396" font-size="11" fill="#333">What never changes: routes,</text>
<text x="878" y="411" font-size="11" fill="#333">services, queries, providers,</text>
<text x="878" y="426" font-size="11" fill="#333">screens. Every box here is</text>
<text x="878" y="441" font-size="11" fill="#333">infrastructure placed around</text>
<text x="878" y="456" font-size="11" fill="#333">them when its trigger is met.</text>
<path d="M30,52.0 H140.0 V155.0 H250" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M30,52.0 H280.0 V155.0 H530" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M250,140.0 H270.0 V140.0 H290" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M410.0,190 V220.0 H410.0 V250" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="416.0" y="216.0" text-anchor="start" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">writes</text>
<path d="M290,175 L270,175 L270,210 L15,210 L15,295 L30,295" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="140" y="205" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">reads</text>
<path d="M530,140 L550,140 L550,97 L965,97 L965,120" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="760" y="92" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">enqueue (jobs table as outbox)</text>
<path d="M965,210 L965,270 L850,270 L830,270" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="965" y="235" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">consume</text>
<path d="M830,300 L850,300 L870,300" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="850" y="317" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">hot cells</text>
<path d="M570,285 L550,285 L530,285" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="550" y="275" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">write</text>
<path d="M700.0,320 V350.0 H700.0 V380" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="706.0" y="346.0" text-anchor="start" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">throttled</text>
<path d="M290,300.0 H270.0 V295.0 H250" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="270.0" y="289.0" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">replication</text>
<path d="M410.0,350 V365.0 H410.0 V380" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="416.0" y="361.0" text-anchor="start" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">outbox → events</text>
<path d="M530,258 L500,215 L800,215 L830,182" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="650" y="210" text-anchor="middle" font-size="11" fill="#444" stroke="#fff" stroke-width="4" paint-order="stroke">NOTIFY</text>
</svg>